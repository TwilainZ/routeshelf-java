plugins { id 'com.android.application' }

def buildRevision = providers.gradleProperty('buildRevision')
    .orElse(providers.environmentVariable('GITHUB_SHA')).getOrElse('local')
if (!(buildRevision ==~ /[A-Za-z0-9._-]{1,64}/)) throw new GradleException('Invalid non-secret build revision')

android {
    namespace 'dev.gdirect.lite.probe'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.gdirect.lite.probe'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '0.2.1-diagnostic-probe'
        buildConfigField 'String', 'REVISION', '"' + buildRevision + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation 'com.google.android.material:material:1.13.0' }
