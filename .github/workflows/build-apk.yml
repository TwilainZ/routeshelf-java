name: Build and check Android APK

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore dedicated test signing key when configured
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.GDIRECT_TEST_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$TEST_KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$TEST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gdirect-test.keystore"
            keytool -list -keystore "$RUNNER_TEMP/gdirect-test.keystore" -storepass android -alias androiddebugkey > /dev/null
            printf 'GDIRECT_TEST_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/gdirect-test.keystore" >> "$GITHUB_ENV"
            echo 'GDIRECT_SIGNING_MODE=pinned-test' >> "$GITHUB_ENV"
          else
            echo 'GDIRECT_SIGNING_MODE=temporary-debug' >> "$GITHUB_ENV"
            echo '::warning::No dedicated test signing secret. This temporary certificate may not match an existing OAuth client.'
          fi
      - name: Install Android SDK packages
        run: JAVA_HOME="$JAVA_HOME_21_X64" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'
      - name: Restore pinned preview key only when configured
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.GDIRECT_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PREVIEW_KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gdirect-preview.keystore"
            printf 'GDIRECT_PREVIEW_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/gdirect-preview.keystore" >> "$GITHUB_ENV"
          else
            echo '::notice::Preview source will be compiled/tested/linted. No installable preview will be published without its retained signing key.'
          fi
      - name: Test networking and security policies
        run: bash tests/run-java-checks.sh
      - name: Compile and lint the tracked source
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug :app:testPreviewUnitTest :app:lintPreview :inspector:assembleDebug :inspector:lintDebug --no-daemon --max-workers=2
      - name: Package and verify coexisting preview with retained key
        if: env.GDIRECT_PREVIEW_KEYSTORE_PATH != ''
        run: bash tools/build-preview-apk.sh
      - uses: actions/upload-artifact@v5
        if: env.GDIRECT_PREVIEW_KEYSTORE_PATH != ''
        with:
          name: GDirectLite-coexisting-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/verified-preview/
          if-no-files-found: error
      - name: Verify packaged version, code, resources, and signer
        run: |
          python3 tools/verify-debug-apk.py \
            --aapt2 "$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --revision "$GITHUB_SHA" --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --signing-mode "$GDIRECT_SIGNING_MODE" \
            --output app/build/outputs/verified-apk
          python3 tools/verify-debug-apk.py \
            --aapt2 "$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --apk inspector/build/outputs/apk/debug/inspector-debug.apk --probe \
            --revision "$GITHUB_SHA" --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --signing-mode temporary-debug \
            --output app/build/outputs/verified-inspector
      - uses: actions/upload-artifact@v5
        with:
          name: GDirectLite-0.3.0-direct-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/verified-apk/
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: GDirectLite-inspector-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/verified-inspector/
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Android-check-reports
          path: app/build/reports/
          if-no-files-found: ignore
